<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zoo</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e4e2db;
  --accent: #2f6f4f; --accent-soft: #e3efe8; --deny: #b3261e; --deny-soft: #fbe9e7;
  --warn: #9a6400; --warn-soft: #fdf1dc; --new: #2357a8; --new-soft: #e6eefb;
  --bar: #d9d6cc; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141513; --panel: #1c1d1a; --ink: #ecebe6; --muted: #9c9a92; --line: #2c2d29;
    --accent: #6cc495; --accent-soft: #1f3328; --deny: #ff8a80; --deny-soft: #3a1f1d;
    --warn: #f0b85a; --warn-soft: #3a2e17; --new: #8ab4f8; --new-soft: #1d2a3d; --bar: #34352f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
.brand span { color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dot.off { background: var(--deny); }
.stats { display: flex; gap: 18px; margin-left: auto; font-size: 12px; color: var(--muted); }
.stats b { color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; margin-right: 4px; }
main { padding: 20px 24px 40px; max-width: 1400px; margin: 0 auto; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 24px 0 10px; font-weight: 600; }
.err { background: var(--deny-soft); color: var(--deny); padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; display: none; }
.cages { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.cage { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.cage.stopped { opacity: 0.6; }
.cage-top { display: flex; align-items: center; gap: 8px; }
.cage-name { font-weight: 650; font-size: 15px; }
.cage-path { color: var(--muted); font-size: 12px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 2px 0 10px; }
.meter { margin: 6px 0; font-size: 12px; }
.meter-row { display: flex; justify-content: space-between; color: var(--muted); }
.meter-row span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
.bar > i.hot { background: var(--warn); }
.bar > i.max { background: var(--deny); }
.cage-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
.chip { padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600; }
.chip.learn { background: var(--warn-soft); color: var(--warn); }
.chip.iso { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
.chip.weak { background: var(--warn-soft); color: var(--warn); }
.chip.size { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
.spacer { flex: 1; }
button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--muted); }
button.danger:hover { border-color: var(--deny); color: var(--deny); }
button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.empty { color: var(--muted); padding: 18px; border: 1px dashed var(--line); border-radius: 10px; text-align: center; }
.empty code { font-family: var(--mono); background: var(--panel); padding: 1px 6px; border-radius: 4px; }
.alerts { display: flex; flex-direction: column; gap: 6px; }
.alert { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.alert.crit { background: var(--deny-soft); color: var(--deny); }
.alert b { font-weight: 650; }
.alert time { margin-left: auto; font-size: 12px; opacity: .8; font-variant-numeric: tabular-nums; }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.filters input, .filters select { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
.filters input { flex: 1; min-width: 220px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.count { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
.table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: 62vh; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.denied td { background: var(--deny-soft); }
tr.fresh td { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--new-soft); } }
td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
td.time { font-family: var(--mono); color: var(--muted); }
td.host { font-family: var(--mono); max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
td.host small { color: var(--muted); }
.verdict { font-size: 11px; font-weight: 650; padding: 1px 7px; border-radius: 4px; }
.verdict.ok { background: var(--accent-soft); color: var(--accent); }
.verdict.no { background: var(--deny); color: var(--panel); }
.tag { font-size: 10.5px; font-weight: 650; padding: 1px 6px; border-radius: 4px; margin-left: 4px; }
.tag.new { background: var(--new-soft); color: var(--new); }
.tag.learn { background: var(--warn-soft); color: var(--warn); }
.tag.unlisted { background: var(--warn-soft); color: var(--warn); }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; padding: 0 5px; border-radius: 4px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="brand">zoo<span>.</span></div>
  <div class="pill" id="backend"><span>backend</span></div>
  <div class="pill" id="keeper"><i class="dot"></i><span>keeper</span></div>
  <div class="pill" id="live"><i class="dot"></i><span>connecting</span></div>
  <div class="stats">
    <div><b id="s-cages">0</b>cages running</div>
    <div><b id="s-rpm">0</b>req/min</div>
    <div><b id="s-denied">0</b>denied (1h)</div>
  </div>
</header>
<main>
  <div class="err" id="err"></div>

  <h2>Cages</h2>
  <div class="cages" id="cages"></div>

  <div id="alerts-wrap" style="display:none">
    <h2>Alerts</h2>
    <div class="alerts" id="alerts"></div>
  </div>

  <h2>Network</h2>
  <div class="filters">
    <input id="q" type="search" placeholder="Search host, URL, cage, status…  (press / to focus)" autocomplete="off">
    <select id="f-cage"><option value="">All cages</option></select>
    <div class="seg" id="f-verdict">
      <button data-v="" class="on">All</button>
      <button data-v="allowed">Allowed</button>
      <button data-v="denied">Denied</button>
      <button data-v="new">New hosts</button>
    </div>
    <button id="pause">Pause</button>
    <span class="count" id="count"></span>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Time</th><th>Cage</th><th>Method</th><th>Host</th><th>Verdict</th><th style="text-align:right">Out</th><th style="text-align:right">In</th><th style="text-align:right">ms</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
const TOKEN = "__ZOO_TOKEN__";
const MAX = 3000, SHOW = 500;
let events = [], state = null, alerts = [], paused = false, pending = [];
const filt = { q: "", cage: "", verdict: "" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function bytes(n) {
  n = Number(n) || 0;
  if (n >= 1 << 30) return (n / (1 << 30)).toFixed(1) + " GB";
  if (n >= 1 << 20) return (n / (1 << 20)).toFixed(1) + " MB";
  if (n >= 1 << 10) return (n / (1 << 10)).toFixed(1) + " KB";
  return n + " B";
}
function memToBytes(s) {
  const m = /^([\d.]+)\s*([KMGT]?)/i.exec(s || "");
  if (!m) return 0;
  return Number(m[1]) * ({ "": 1, K: 1 << 10, M: 1 << 20, G: 1 << 30, T: 2 ** 40 }[m[2].toUpperCase()]);
}
function hhmmss(t) {
  const d = new Date(t);
  return d.toLocaleTimeString([], { hour12: false });
}
function ago(t) {
  const s = Math.max(0, (Date.now() - new Date(t)) / 1000);
  if (s < 60) return Math.floor(s) + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
}
function shortPath(p) {
  if (!p) return "";
  return p.replace(/^\/Users\/[^/]+/, "~");
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Zoo-Token": TOKEN }, body: body ? JSON.stringify(body) : "{}" });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ---- cages ----
function meter(label, value, pct) {
  const cls = pct >= 90 ? "max" : pct >= 70 ? "hot" : "";
  const w = Math.max(0, Math.min(100, pct || 0));
  return `<div class="meter"><div class="meter-row"><span>${label}</span><span>${value}</span></div><div class="bar"><i class="${cls}" style="width:${w}%"></i></div></div>`;
}
function renderCages() {
  const el = $("cages");
  const cages = (state && state.cages) || [];
  $("s-cages").textContent = cages.filter(c => c.running).length;
  if (!cages.length) {
    el.innerHTML = `<div class="empty">No cages yet. In a repo, run <code>zoo run claude</code>.</div>`;
    return;
  }
  el.innerHTML = cages.map(c => {
    const st = c.stat || {};
    const cpus = Number(c.cpus) || 1;
    const cpuPct = st.have && st.have.cpu ? st.cpu_percent / cpus : null;
    const limit = st.mem_limit || memToBytes(c.memory);
    const memPct = st.have && st.have.mem && limit ? (st.mem_used / limit) * 100 : null;
    const meters = c.running ? [
      meter(`CPU · ${cpus} core${cpus > 1 ? "s" : ""}`, cpuPct == null ? "—" : cpuPct.toFixed(0) + "%", cpuPct),
      meter(`Memory · ${esc(c.memory || "")}`, memPct == null ? "—" : `${bytes(st.mem_used)} / ${bytes(limit)}`, memPct),
      `<div class="meter"><div class="meter-row"><span>Network</span><span>${st.have && st.have.net ? `↓ ${bytes(st.net_rx_rate)}/s · ↑ ${bytes(st.net_tx_rate)}/s` : "—"}</span></div></div>`,
    ].join("") : `<div class="meter"><div class="meter-row"><span>${esc(c.status || "stopped")}</span><span></span></div></div>`;
    const sessions = (c.sessions || []).map(s => `<span class="chip" title="started ${esc(s.started)}">${esc(s.harness)} · ${ago(s.started)}</span>`).join("");
    const cnt = c.counts || {};
    return `<div class="cage ${c.running ? "" : "stopped"}">
      <div class="cage-top"><i class="dot ${c.running ? "on" : ""}"></i><span class="cage-name">${esc(c.name)}</span>
        <span class="chip size">${esc(c.size || "custom")}</span>${c.isolation ? `<span class="chip ${c.weaker_isolation ? "weak" : "iso"}" title="${c.weaker_isolation ? "started below the isolation floor (--allow-weaker-isolation)" : "isolation level"}">${esc(c.isolation)}${c.weaker_isolation ? " · below floor" : ""}</span>` : ""}${c.learn ? `<span class="chip learn">learn mode</span>` : ""}
        <span class="spacer"></span>${c.running ? `<button class="danger" data-stop="${esc(c.id)}">Stop</button>` : ""}</div>
      <div class="cage-path" title="${esc(c.worktree)}">${esc(shortPath(c.worktree))}</div>
      ${meters}
      <div class="cage-foot">${sessions || (c.running ? `<span>no agent attached</span>` : "")}<span class="spacer"></span>
        <span>${cnt.requests || 0} req · <span style="color:${cnt.denied ? "var(--deny)" : "inherit"}">${cnt.denied || 0} denied</span> · ${cnt.hosts || 0} hosts</span></div>
    </div>`;
  }).join("");
  // cage filter options
  const sel = $("f-cage"), cur = sel.value;
  const names = [...new Set([...cages.map(c => c.name), ...events.map(e => e.cage)])].sort();
  sel.innerHTML = `<option value="">All cages</option>` + names.map(n => `<option ${n === cur ? "selected" : ""}>${esc(n)}</option>`).join("");
}
document.addEventListener("click", async (ev) => {
  const stop = ev.target.closest("[data-stop]");
  if (stop) {
    if (!confirm(`Stop ${stop.dataset.stop}? The worktree is untouched.`)) return;
    stop.disabled = true;
    try { await post(`/api/cages/${encodeURIComponent(stop.dataset.stop)}/stop`); } catch (e) { alert(e.message); }
  }
  const allow = ev.target.closest("[data-allow]");
  if (allow) {
    if (!confirm(`Allow ${allow.dataset.allow} for every cage?`)) return;
    allow.disabled = true;
    try { await post("/api/allow", { host: allow.dataset.allow }); if (state) state.allowlist.push(allow.dataset.allow); renderRows(); }
    catch (e) { alert(e.message); allow.disabled = false; }
  }
});

// ---- header ----
function renderHeader() {
  const b = (state && state.backend) || {};
  if (b.name) $("backend").innerHTML = `<span>${esc(b.name)}${b.detail ? " · " + esc(b.detail) : ""} · ${esc(b.isolation || "?")} isolation</span>`;
  const k = (state && state.keeper) || {};
  $("keeper").innerHTML = `<i class="dot ${k.running ? "on" : "off"}"></i><span>keeper ${k.running ? esc(k.ip || "running") : "down"}</span>`;
  const now = Date.now();
  $("s-rpm").textContent = events.filter(e => now - new Date(e.time) < 60e3).length;
  $("s-denied").textContent = events.filter(e => e.denied && now - new Date(e.time) < 3600e3).length;
  const err = $("err");
  if (state && state.error) { err.style.display = "block"; err.textContent = state.error; } else err.style.display = "none";
}

// ---- alerts ----
function renderAlerts() {
  const recent = alerts.slice(-5).reverse();
  $("alerts-wrap").style.display = recent.length ? "" : "none";
  $("alerts").innerHTML = recent.map(a => `<div class="alert ${a.level === "crit" ? "crit" : ""}"><b>${esc(a.title)}</b><span>${esc(a.cage)} · ${esc(a.body)}</span><time>${hhmmss(a.time)}</time></div>`).join("");
}

// ---- network ----
function listed(host) {
  const list = (state && state.allowlist) || [];
  return list.some(e => e.startsWith(".") ? host === e.slice(1) || host.endsWith(e) : host === e);
}
function matches(e) {
  if (filt.cage && e.cage !== filt.cage) return false;
  if (filt.verdict === "allowed" && e.denied) return false;
  if (filt.verdict === "denied" && !e.denied) return false;
  if (filt.verdict === "new" && !e.first_seen) return false;
  if (filt.q) {
    const hay = `${e.host} ${e.url} ${e.cage} ${e.method} ${e.status} ${e.squid} ${e.denied ? "denied blocked" : "allowed"}`.toLowerCase();
    for (const term of filt.q.toLowerCase().split(/\s+/).filter(Boolean)) {
      if (term.startsWith("-") ? hay.includes(term.slice(1)) : !hay.includes(term)) return false;
    }
  }
  return true;
}
let lastTop = 0;
function renderRows() {
  const shown = [];
  for (let i = events.length - 1; i >= 0 && shown.length < SHOW; i--) if (matches(events[i])) shown.push(events[i]);
  const total = events.filter(matches).length;
  $("count").textContent = `${total} request${total === 1 ? "" : "s"}${total > SHOW ? ` · showing latest ${SHOW}` : ""}${paused ? ` · paused (${pending.length} new)` : ""}`;
  $("rows").innerHTML = shown.map(e => {
    const path = e.method === "CONNECT" ? "" : (() => { try { const u = new URL(e.url); return u.pathname + u.search; } catch { return ""; } })();
    const onList = listed(e.host);
    const tags = (e.first_seen ? `<span class="tag new">NEW</span>` : "") + (e.learn ? `<span class="tag learn">LEARN</span>` : "") + (!e.denied && !onList ? `<span class="tag unlisted">NOT LISTED</span>` : "");
    const action = !onList && e.host ? `<button data-allow="${esc(e.host)}">Allow</button>` : "";
    return `<tr class="${e.denied ? "denied" : ""} ${e.id > lastTop ? "fresh" : ""}">
      <td class="time">${hhmmss(e.time)}</td><td>${esc(e.cage)}</td><td>${esc(e.method)}</td>
      <td class="host" title="${esc(e.url)}">${esc(e.host)}${path ? `<small>${esc(path.length > 60 ? path.slice(0, 60) + "…" : path)}</small>` : ""}${tags}</td>
      <td><span class="verdict ${e.denied ? "no" : "ok"}">${e.denied ? "DENIED" : e.status || "OK"}</span></td>
      <td class="num">${bytes(e.bytes_out)}</td><td class="num">${bytes(e.bytes_in)}</td><td class="num">${e.ms}</td><td>${action}</td></tr>`;
  }).join("") || `<tr><td colspan="9" style="color:var(--muted);text-align:center;padding:24px">${events.length ? "Nothing matches these filters." : "No traffic yet. Requests from cages appear here live."}</td></tr>`;
  if (events.length) lastTop = events[events.length - 1].id;
}

$("q").addEventListener("input", (e) => { filt.q = e.target.value.trim(); renderRows(); });
$("f-cage").addEventListener("change", (e) => { filt.cage = e.target.value; renderRows(); });
$("f-verdict").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  filt.verdict = b.dataset.v;
  [...$("f-verdict").children].forEach(x => x.classList.toggle("on", x === b));
  renderRows();
});
$("pause").addEventListener("click", () => {
  paused = !paused;
  $("pause").textContent = paused ? "Resume" : "Pause";
  $("pause").classList.toggle("on", paused);
  if (!paused) { events.push(...pending); pending = []; trim(); }
  renderRows();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("q")) { $("q").value = ""; filt.q = ""; renderRows(); $("q").blur(); }
});
function trim() { if (events.length > MAX) events = events.slice(events.length - MAX); }

// ---- data ----
let rowTimer = null;
function scheduleRows() { if (!rowTimer) rowTimer = setTimeout(() => { rowTimer = null; renderRows(); renderHeader(); }, 150); }

async function load() {
  const r = await fetch("/api/state");
  const d = await r.json();
  state = d.state; events = d.events || []; alerts = d.alerts || [];
  renderCages(); renderHeader(); renderAlerts(); renderRows();
}
function connect() {
  const es = new EventSource("/api/stream");
  const live = (on) => $("live").innerHTML = `<i class="dot ${on ? "on" : "off"}"></i><span>${on ? "live" : "reconnecting"}</span>`;
  es.onopen = () => live(true);
  es.onerror = () => live(false);
  es.addEventListener("state", (m) => { state = JSON.parse(m.data); renderCages(); renderHeader(); });
  es.addEventListener("net", (m) => {
    const e = JSON.parse(m.data);
    if (paused) pending.push(e); else { events.push(e); trim(); }
    scheduleRows();
  });
  es.addEventListener("alert", (m) => { alerts.push(JSON.parse(m.data)); renderAlerts(); });
}
load().catch(e => { $("err").style.display = "block"; $("err").textContent = "Can't reach the zoo daemon: " + e.message; });
connect();
setInterval(renderHeader, 5000);
</script>
</body>
</html>
