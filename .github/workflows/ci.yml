name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: shellcheck -s bash assets/images/cage/zoo-doctor && shellcheck -s sh assets/images/cage/zoo-init assets/images/keeper/keeper-entrypoint

  # Windows: paths, process handling (no console windows: D25), the docker
  # API client over a real named pipe. keys and sshagent still assume Unix
  # (phases 2-3 of Windows support). No Linux containers on these runners,
  # so the escape suite on Windows is run by hand.
  windows-unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go vet ./...
      - run: go test ./assets/... ./cmd/... ./internal/proc/... ./internal/backend/... ./internal/cage/... ./internal/keeper/... ./internal/services/... ./internal/jsonx/... ./internal/gitrefs/...

  # M1 gate: docker backend, escape suite inside a real cage.
  docker-escape-suite:
    runs-on: ubuntu-latest
    env:
      ZOO_HOME: ${{ github.workspace }}/.zoo-ci
      ZOO_KEYS_FILE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go build -o zoo ./cmd/zoo
      - name: zoo up
        run: ./zoo up --backend docker --isolation-floor container
      - name: test repo (main checkout + linked worktree, with secrets)
        run: |
          git init -q /tmp/repo && cd /tmp/repo
          echo SECRET=1 > .env && echo hi > README.md
          git add README.md && git -c user.name=ci -c user.email=ci@ci commit -qm init
          git worktree add -q /tmp/repo-wt && echo SECRET=2 > /tmp/repo-wt/.env
      - name: escape suite (main checkout)
        working-directory: /tmp/repo
        run: $GITHUB_WORKSPACE/zoo doctor
      - name: escape suite (linked worktree)
        working-directory: /tmp/repo-wt
        run: $GITHUB_WORKSPACE/zoo doctor
      - name: secrets read empty inside, intact outside
        working-directory: /tmp/repo
        run: |
          test -z "$($GITHUB_WORKSPACE/zoo run shell -- -c 'cat .env')"
          grep -q SECRET=1 .env
      - name: secrets in build output, and ones added after the cage started, are hidden
        working-directory: /tmp/repo
        run: |
          # Added while the cage runs: readable until it restarts, and zoo says so.
          mkdir -p .next/standalone && echo SECRET=3 > .next/standalone/.env
          $GITHUB_WORKSPACE/zoo run shell -- -c true 2>&1 | tee /tmp/run.txt
          grep -q 'secret files in /tmp/repo changed' /tmp/run.txt
          $GITHUB_WORKSPACE/zoo stop /tmp/repo
          test -z "$($GITHUB_WORKSPACE/zoo run shell -- -c 'cat .next/standalone/.env')"
          grep -q SECRET=3 .next/standalone/.env
      - name: a repository planted by the agent is caught on the host
        working-directory: /tmp/repo
        run: |
          $GITHUB_WORKSPACE/zoo run shell -- -c 'mkdir -p planted/.git'
          if $GITHUB_WORKSPACE/zoo doctor > /tmp/doctor.txt 2>&1; then cat /tmp/doctor.txt; exit 1; fi
          grep -q 'git-traps: /tmp/repo/planted/.git (nested repository)' /tmp/doctor.txt
          rm -rf planted
          $GITHUB_WORKSPACE/zoo doctor
      - name: a branch moved by the agent is reported on the host
        working-directory: /tmp/repo-wt
        run: |
          git -C /tmp/repo branch victim
          $GITHUB_WORKSPACE/zoo run shell -- -c 'git -c user.name=a -c user.email=a@a commit -q --allow-empty -m evil && git update-ref refs/heads/victim HEAD' 2> /tmp/run.txt
          cat /tmp/run.txt
          grep -q 'refs/heads/victim moved' /tmp/run.txt
          grep -q 'undo: git update-ref refs/heads/victim' /tmp/run.txt
          $GITHUB_WORKSPACE/zoo refs 2>&1 | grep -q 'refs/heads/victim moved'
          $GITHUB_WORKSPACE/zoo refs ok
          $GITHUB_WORKSPACE/zoo refs 2>&1 | grep -q 'no branches or tags moved'
      - name: floor refuses container isolation by default
        working-directory: /tmp/repo
        run: |
          if $GITHUB_WORKSPACE/zoo --isolation-floor microvm run shell -- -c true; then exit 1; fi
      - if: always()
        run: |
          ./zoo ls || true
          docker logs zoo-keeper 2>&1 | tail -20 || true
          tail -50 "$ZOO_HOME/keeper/log/access.log" || true
